name: Sprawdzanie wolnych terminów

on:
  schedule:
    # GitHub nie gwarantuje dokładnie co 5 minut przy dużym obciążeniu,
    # ale to najczęstszy praktyczny minimalny odstęp.
    - cron: "*/5 * * * *"
  workflow_dispatch: {} # pozwala odpalić ręcznie z zakładki Actions na GitHubie

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Zbuduj pełny łańcuch certyfikatów (fix brakującego intermediate)
        run: |
          set -e
          HOST="kwalifikacje.raszeja.poznan.pl"

          # Pobierz certyfikat liścia i wyciągnij URL do certyfikatu wystawcy (AIA)
          openssl s_client -connect "$HOST:443" -servername "$HOST" </dev/null 2>/dev/null \
            | openssl x509 -noout -text > leaf_info.txt

          echo "--- Pole Authority Information Access ---"
          grep -A2 "CA Issuers" leaf_info.txt || echo "Brak pola AIA - certyfikat nie wskazuje URL do intermediate."

          AIA_URL=$(grep -A1 "CA Issuers" leaf_info.txt | grep -o 'http[^ ]*' | head -1)
          echo "Znaleziony URL: $AIA_URL"

          if [ -n "$AIA_URL" ]; then
            curl -sL "$AIA_URL" -o intermediate_raw.crt
            # Serwer AIA może zwrócić DER albo PEM - próbujemy oba
            if openssl x509 -inform DER -in intermediate_raw.crt -out intermediate.pem 2>/dev/null; then
              echo "Skonwertowano z DER."
            else
              cp intermediate_raw.crt intermediate.pem
              echo "Użyto jako PEM bez konwersji."
            fi
            openssl x509 -noout -subject -in intermediate.pem
          else
            echo "Nie znaleziono AIA - tworzę pusty plik intermediate.pem"
            touch intermediate.pem
          fi

          # Zbuduj pełny bundle: systemowe CA + doklejony intermediate
          cat /etc/ssl/certs/ca-certificates.crt intermediate.pem > full-ca-bundle.pem
          echo "Bundle gotowy: $(grep -c 'BEGIN CERTIFICATE' full-ca-bundle.pem) certyfikatów."

      - name: Sprawdź dostępność i wyślij powiadomienie
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          set -e
          RESPONSE=$(curl -s --cacert full-ca-bundle.pem "https://kwalifikacje.raszeja.poznan.pl/api/visit-types/2/availability")
          echo "Odpowiedź API: $RESPONSE"

          FREE=$(echo "$RESPONSE" | jq -c '[.availability[] | select(.available == true and .availableSlots > 0 and .excluded == false)]')
          COUNT=$(echo "$FREE" | jq 'length')

          if [ "$COUNT" -gt 0 ]; then
            VISIT_NAME=$(echo "$RESPONSE" | jq -r '.visitTypeName')
            LIST=$(echo "$FREE" | jq -r '.[] | "\(.date): \(.availableSlots)/\(.totalSlots) miejsc"')
            TEXT="Dostępne terminy ($VISIT_NAME)!
          $LIST"

            curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg chat_id "$TG_CHAT_ID" --arg text "$TEXT" '{chat_id: $chat_id, text: $text}')"
          else
            echo "Brak wolnych terminów."
          fi
