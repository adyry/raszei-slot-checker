name: Sprawdzanie wolnych terminów

on:
  schedule:
    # GitHub nie gwarantuje dokładnie co 5 minut przy dużym obciążeniu,
    # ale to najczęstszy praktyczny minimalny odstęp.
    - cron: "*/5 * * * *"
  workflow_dispatch: {} # pozwala odpalić ręcznie z zakładki Actions na GitHubie

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Debug - pokaż łańcuch certyfikatów
        run: |
          echo "--- openssl s_client (pełny łańcuch od serwera) ---"
          openssl s_client -connect kwalifikacje.raszeja.poznan.pl:443 \
            -servername kwalifikacje.raszeja.poznan.pl -showcerts </dev/null 2>/dev/null \
            | awk '/BEGIN CERTIFICATE/,/END CERTIFICATE/ { print }' \
            | tee chain_raw.pem | grep -c "BEGIN CERTIFICATE" || true

          echo "--- Szczegóły certyfikatu (issuer/subject) ---"
          openssl s_client -connect kwalifikacje.raszeja.poznan.pl:443 \
            -servername kwalifikacje.raszeja.poznan.pl </dev/null 2>/dev/null \
            | openssl x509 -noout -issuer -subject

          echo "--- Wersja curl i test z -v ---"
          curl --version | head -1
          curl -v "https://kwalifikacje.raszeja.poznan.pl/api/visit-types/2/availability" 2>&1 | tail -40 || true

      - name: Sprawdź dostępność i wyślij powiadomienie
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          set -e
          RESPONSE=$(curl -s "https://kwalifikacje.raszeja.poznan.pl/api/visit-types/2/availability")
          echo "Odpowiedź API: $RESPONSE"

          FREE=$(echo "$RESPONSE" | jq -c '[.availability[] | select(.available == true and .availableSlots > 0 and .excluded == false)]')
          COUNT=$(echo "$FREE" | jq 'length')

          if [ "$COUNT" -gt 0 ]; then
            VISIT_NAME=$(echo "$RESPONSE" | jq -r '.visitTypeName')
            LIST=$(echo "$FREE" | jq -r '.[] | "\(.date): \(.availableSlots)/\(.totalSlots) miejsc"')
            TEXT="Dostępne terminy ($VISIT_NAME)!
          $LIST"

            curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg chat_id "$TG_CHAT_ID" --arg text "$TEXT" '{chat_id: $chat_id, text: $text}')"
          else
            echo "Brak wolnych terminów."
          fi
